<!DOCTYPE html>
<html lang="ko" data-theme="diary">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBFBF7" id="theme-color">
<title>Swarm Insights</title>
<script src="/static/ui.js?v=3"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="/static/ui.css?v=3">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.NAVER_MAP_KEY_ID = {{ naver_map_key_id|tojson }};</script>
<script src="/static/naver-base.js?v=2"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/ko.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
<script src="/static/venue-pick.js?v=1"></script>
<script src="/static/si.js?v=3"></script>
<script src="/static/playback.js?v=3"></script>
</head>
<body class="m-body">

<!-- 지도 -->
<div id="tab-map" class="tab-view active">
  <div id="map"></div>
  <div class="m-top">
    <label class="m-search"><i data-lucide="search"></i><input type="search" id="map-search" placeholder="장소·분류 찾기" autocomplete="off"></label>
    <button class="fab" onclick="UI.openSettings()" aria-label="설정" style="width:42px;height:42px"><i data-lucide="settings-2"></i></button>
  </div>
  <div class="fabs">
    <button class="fab" id="btn-loc" onclick="goToMyLocation()" aria-label="내 위치"><i data-lucide="locate-fixed"></i></button>
    <button class="fab" id="btn-heat" onclick="toggleHeat()" aria-label="히트맵"><i data-lucide="flame"></i></button>
  </div>
  <div class="np" id="now-playing" hidden>
    <div class="np-body">
      <div class="np-bar"><span class="np-live"><i></i>재생 중</span><span class="np-prog" id="np-prog"></span></div>
      <div class="np-main">
        <div class="np-when"><b id="np-date"></b><span id="np-time"></span></div>
        <div class="np-what"><b id="np-venue"></b><span id="np-sub"></span></div>
      </div>
      <div class="np-foot"><span><small>분류</small><b id="np-cat"></b></span><span><small>이전 방문</small><b id="np-prev"></b></span><span><small>이 장소</small><b id="np-cnt"></b></span></div>
    </div>
    <div class="np-stub"><small>순번</small><b id="np-no"></b><div class="np-code" id="np-code"></div></div>
  </div>
  <div class="tl">
    <button class="tl-play play" id="play-btn" aria-label="이동 경로 재생"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
    <button class="tl-play stop" id="stop-btn" aria-label="정지" hidden><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    <div class="tl-mid">
      <div class="tl-top"><span id="tl-label">불러오는 중</span><span class="tl-cnt" id="tl-cnt"></span></div>
      <div class="seg" id="map-periods">
        <button class="pill" data-days="7">1주</button><button class="pill" data-days="30">1개월</button><button class="pill" data-days="90">3개월</button><button class="pill" data-days="365">1년</button><button class="pill on" data-days="all">전체</button>
      </div>
    </div>
  </div>
</div>

<!-- 기록 -->
<div id="tab-history" class="tab-view">
  <div class="m-head"><h2>방문 기록</h2><span class="cnt" id="hist-cnt"></span><button class="ib" onclick="UI.openSettings()" aria-label="설정"><i data-lucide="settings-2"></i></button></div>
  <div class="m-sub"><label class="gnb-search"><i data-lucide="search"></i><input type="search" id="hist-search" placeholder="장소·분류 찾기" autocomplete="off"></label></div>
  <div class="vlist" id="history-list"><div class="vempty">불러오는 중</div></div>
</div>

<!-- 추가 -->
<div id="tab-add" class="tab-view">
  <div class="m-head"><h2>새 기록</h2><button class="ib" onclick="UI.openSettings()" aria-label="설정"><i data-lucide="settings-2"></i></button></div>
  <div class="m-scroll">
    <div class="m-form">
      <h3>어디</h3>
      <div class="field">
        <label for="a-venue">장소</label>
        <input type="text" id="a-venue" placeholder="이름으로 찾기" autocomplete="off">
        <input type="hidden" id="a-venue-only"><input type="hidden" id="a-venue-id"><input type="hidden" id="a-country"><input type="hidden" id="a-countrycode">
        <input type="hidden" id="a-kakao-place-id"><input type="hidden" id="a-tmap-poi-id"><input type="hidden" id="a-resolved">
        <div id="a-venue-results" class="ac"></div>
      </div>
      <div class="field"><label for="a-venue-sub">지점</label><input type="text" id="a-venue-sub" placeholder="예: 강남점"></div>
      <div class="field"><label for="a-category">분류</label><input type="text" id="a-category" autocomplete="off"><div id="a-cat-results" class="ac"></div></div>
      <div class="field">
        <label for="a-address">주소</label>
        <input type="text" id="a-address" placeholder="오른쪽 지도 버튼으로 고르기" style="padding-right:40px">
        <button class="loc-btn" type="button" onclick="openMapPicker()" aria-label="지도에서 고르기" style="width:36px;height:36px"><i data-lucide="map-pinned"></i></button>
        <input type="hidden" id="a-lat"><input type="hidden" id="a-lng"><input type="hidden" id="a-offset" value="540">
      </div>
      <div class="mg-note" id="a-note"></div>
      <h3>언제</h3>
      <div class="field"><label for="a-time">방문 시각</label><input type="text" id="a-time" placeholder="날짜와 시각" readonly></div>
      <div class="field"><label for="a-shout">메모</label><input type="text" id="a-shout" placeholder="한 줄 남기기"></div>
    </div>
  </div>
  <button class="btn m-submit" id="submit-btn" onclick="submitAdd()">기록하기</button>
</div>

<!-- 통계 -->
<div id="tab-stats" class="tab-view">
  <div class="m-head"><h2>통계</h2><span class="cnt num" data-st="range" id="st-range"></span><button class="ib" onclick="UI.openSettings()" aria-label="설정"><i data-lucide="settings-2"></i></button></div>
  <div class="m-scroll"><div class="m-stats" id="stats-root">
    <div class="seg" id="stat-periods">
      <button data-days="7">1주</button><button data-days="30">1개월</button><button class="on" data-days="90">3개월</button><button data-days="365">1년</button><button data-days="all">전체</button>
    </div>
    <p class="st-sum" data-st="sum"></p>
    <section class="st-sec" data-st="timeline"><h3>월별 방문</h3><div class="chart-box"><canvas id="c-timeline"></canvas></div></section>
    <section class="st-sec" data-st="venues"><h3>많이 간 장소</h3><div class="rk"></div></section>
    <section class="st-sec" data-st="cats"><h3>많이 간 분류</h3><div class="rk"></div></section>
    <section class="st-sec" data-st="hourly"><h3>시간대</h3><div class="chart-box"><canvas id="c-hourly"></canvas></div></section>
    <section class="st-sec" data-st="weekday"><h3>요일</h3><div class="chart-box"><canvas id="c-weekday"></canvas></div></section>
    <section class="st-sec" data-st="activity"><h3>요일 × 시간 <small>진할수록 자주</small></h3><div class="act-wrap" style="overflow-x:auto"></div></section>
    <section class="st-sec" data-st="regions"><h3>지역</h3><div class="rk"></div></section>
    <section class="st-sec" data-st="newv"><h3>처음 가 본 곳</h3><div class="chart-box"><canvas id="c-newvenues"></canvas></div></section>
  </div></div>
</div>

<nav class="mnav">
  <a class="on" id="nav-map" onclick="switchTab('map')"><i data-lucide="map"></i><span>지도</span></a>
  <a id="nav-history" onclick="switchTab('history')"><i data-lucide="notebook-text"></i><span>기록</span></a>
  <a id="nav-add" onclick="switchTab('add')"><i data-lucide="pencil-line"></i><span>추가</span></a>
  <a id="nav-stats" onclick="switchTab('stats')"><i data-lucide="chart-no-axes-column"></i><span>통계</span></a>
</nav>

<div class="sheet-dim" id="detail-sheet-overlay" onclick="closeDetailSheet(event)">
  <div class="sheet" id="detail-sheet"><div class="sheet-grip"></div><div id="detail-body"></div></div>
</div>

<div id="map-picker-overlay">
  <div class="picker-header">
    <button class="btn ghost sm" onclick="closeMapPicker()">취소</button>
    <input type="text" class="inp" id="picker-search-input" placeholder="장소 이름이나 주소">
    <button class="btn sm" onclick="searchOnPicker()">찾기</button>
  </div>
  <div id="picker-map"></div>
  <div class="picker-footer">
    <div id="picker-addr-text">지도를 눌러 위치를 고르세요</div>
    <button class="btn" onclick="confirmLocation()">이 위치로 직접 입력</button>
  </div>
</div>

<script>
moment.locale('ko');
const $ = id => document.getElementById(id);
const escHtml = SI.esc;
let map, markers, heatLayer = null, isHeat = false, player = null;
let allMarkers = [], markerBy = new Map(), currentFilter = 'all', statsPeriod = '90', histLimit = 150;
let pickerMapInst = null, pickerMarker = null, pickerLat = null, pickerLng = null, pickerAddr = '', pickerGeo = null;

function themeColor() { $('theme-color').content = UI.theme() === 'board' ? '#111317' : '#FBFBF7'; }
themeColor();

/* ── 탭 ── */
function switchTab(name) {
  document.querySelectorAll('.tab-view').forEach(t => t.classList.toggle('active', t.id === 'tab-' + name));
  document.querySelectorAll('.mnav a').forEach(t => t.classList.toggle('on', t.id === 'nav-' + name));
  if (name === 'map') setTimeout(() => map && map.invalidateSize(), 60);
  else if (name === 'history') renderHistory();
  else if (name === 'stats') SI.renderStats($('tab-stats'), statsPeriod, { small: true });
}

/* ── 지도 ── */
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 11);
  UI.baseMap(map);
  markers = L.markerClusterGroup({
    maxClusterRadius: 50, showCoverageOnHover: false, chunkedLoading: true,
    iconCreateFunction: c => { const n = c.getChildCount(), s = n > 999 ? 44 : n > 99 ? 38 : 32;
      return L.divIcon({ className: '', html: `<div class="mk-cl" style="width:${s}px;height:${s}px">${n.toLocaleString()}</div>`, iconSize: [s, s] }); }
  });
  map.addLayer(markers);
  // iOS 더블탭 확대
  let last = 0;
  map.getContainer().addEventListener('touchend', e => {
    if (e.touches.length) return;
    const now = Date.now();
    if (now - last < 300 && e.changedTouches.length === 1) {
      const r = map.getContainer().getBoundingClientRect(), t = e.changedTouches[0];
      map.setView(map.containerPointToLatLng(L.point(t.clientX - r.left, t.clientY - r.top)), map.getZoom() + 1, { animate: true });
      e.preventDefault();
    }
    last = now;
  }, { passive: false });
  let me = null;
  map.on('locationfound', e => { if (me) map.removeLayer(me); me = L.marker(e.latlng, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18] }) }).addTo(map); });
  map.on('locationerror', () => alert('현재 위치를 찾을 수 없어요.'));
}
function buildMarkers() {
  allMarkers = SI.all.map(d => {
    const m = L.marker([d.latNum, d.lngNum], { icon: L.divIcon({ className: '', html: '<div class="mk"></div>', iconSize: [14, 14] }) });
    m.item = d; m.on('click', () => openDetailSheet(d));
    markerBy.set(d.FSQ_UNIXTIME, m);
    return m;
  });
}
function mapFiltered() {
  const q = $('map-search').value.trim().toLowerCase(), all = SI.all;
  if (!all.length) return [];
  const cut = currentFilter === 'all' ? 0 : all[all.length - 1].FSQ_UNIXTIME - parseInt(currentFilter) * 86400;
  return all.filter(d => d.FSQ_UNIXTIME >= cut && SI.match(d, q));
}
function applyMapFilter() {
  if (!map || (player && player.playing)) return;
  const list = mapFiltered();
  if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
  markers.clearLayers();
  if (isHeat) heatLayer = L.heatLayer(list.map(d => [d.latNum, d.lngNum, .6]), { radius: 26, blur: 18, maxZoom: 17,
    gradient: UI.theme() === 'board' ? { .3: '#5a4310', .6: '#B58A2C', 1: '#FFC23D' } : { .3: '#BFD0EE', .6: '#E8B23A', 1: '#E0574F' } }).addTo(map);
  else { const ids = new Set(list.map(d => d.FSQ_UNIXTIME)); markers.addLayers(allMarkers.filter(m => ids.has(m.item.FSQ_UNIXTIME))); }
  $('tl-label').innerHTML = list.length ? `<b>${moment.unix(list[0].FSQ_UNIXTIME).format('YY.MM.DD')}</b> — <b>${moment.unix(list[list.length - 1].FSQ_UNIXTIME).format('YY.MM.DD')}</b>` : '기록 없음';
  $('tl-cnt').textContent = list.length.toLocaleString() + '번';
}
function toggleHeat() { isHeat = !isHeat; $('btn-heat').classList.toggle('on', isHeat); applyMapFilter(); }
function goToMyLocation() { map.locate({ setView: true, maxZoom: 15 }); }
document.querySelectorAll('#map-periods button').forEach(p => p.onclick = () => {
  document.querySelectorAll('#map-periods button').forEach(x => x.classList.toggle('on', x === p));
  currentFilter = p.dataset.days; applyMapFilter();
});
let ms = null; $('map-search').addEventListener('input', () => { clearTimeout(ms); ms = setTimeout(applyMapFilter, 200); });

/* ── 재생 ── */
function makePlayback() {
  return Playback.create(map, {
    padding: () => UI.theme() === 'board' ? [[40, 90], [40, 250]] : [[40, 170], [40, 110]],
    onStart() { $('play-btn').hidden = true; $('stop-btn').hidden = false; $('now-playing').hidden = false; markers.clearLayers(); if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; } },
    onStep(d, i, n) { SI.fillNP(d, i, n); $('tl-label').innerHTML = `<b>${i + 1}</b> / ${n} · <b>${moment.unix(d.FSQ_UNIXTIME).format('YY.MM.DD')}</b>`; },
    onEnd() { $('tl-label').textContent = '재생을 마쳤어요'; setTimeout(stopPlay, 1600); },
  });
}
$('play-btn').onclick = () => {
  const list = mapFiltered(); if (!list.length) return;
  if (list.length > 2000 && !confirm(`${list.length.toLocaleString()}번 방문을 재생해요. 기간을 1주·1개월로 좁히면 보기 좋아요. 그대로 할까요?`)) return;
  player.start(list, 400);
};
function stopPlay() { player.stop(true); $('play-btn').hidden = false; $('stop-btn').hidden = true; $('now-playing').hidden = true; applyMapFilter(); }
$('stop-btn').onclick = stopPlay;

/* ── 기록 목록 ── */
function renderHistory() {
  const q = $('hist-search').value.trim().toLowerCase();
  const list = SI.all.filter(d => SI.match(d, q));
  $('hist-cnt').textContent = list.length.toLocaleString() + '번';
  const items = list.slice(-histLimit).reverse();
  $('history-list').innerHTML = SI.listHTML(items) + (list.length > histLimit ? `<button class="vmore" id="hmore">${(list.length - histLimit).toLocaleString()}번 더 보기</button>` : '');
  const more = $('hmore'); if (more) more.onclick = () => { histLimit += 300; renderHistory(); };
}
$('history-list').addEventListener('click', e => { const r = e.target.closest('.vrow'); if (r) { const m = markerBy.get(+r.dataset.t); if (m) openDetailSheet(m.item); } });
let hs = null; $('hist-search').addEventListener('input', () => { clearTimeout(hs); histLimit = 150; hs = setTimeout(renderHistory, 150); });

/* ── 상세 시트 ── */
function openDetailSheet(d) {
  $('detail-body').innerHTML = SI.popupHTML(d)
    + (d.ADDRESS ? `<div class="sheet-row"><small>주소</small><span>${escHtml(d.ADDRESS)}</span></div>` : '')
    + `<button class="btn" onclick="showOnMap(${d.latNum},${d.lngNum})">${UI.ic('map')}지도에서 보기</button>`;
  $('detail-sheet-overlay').classList.add('active');
}
function closeDetailSheet(e) { if (e && e.target !== $('detail-sheet-overlay')) return; $('detail-sheet-overlay').classList.remove('active'); }
function showOnMap(lat, lng) { $('detail-sheet-overlay').classList.remove('active'); switchTab('map'); setTimeout(() => map.setView([lat, lng], 16), 250); }

/* ── 통계 ── */
document.querySelectorAll('#stat-periods button').forEach(c => c.onclick = () => {
  document.querySelectorAll('#stat-periods button').forEach(x => x.classList.toggle('on', x === c));
  statsPeriod = c.dataset.days; SI.renderStats($('tab-stats'), statsPeriod, { small: true });
});

/* ── 추가 ── */
function setVal(id, v) { const el = $(id); if (el) el.value = v; }
function initAddForm() {
  flatpickr('#a-time', { enableTime: true, dateFormat: 'Y-m-d H:i', altInput: true, altFormat: 'Y-m-d (D) H:i', locale: 'ko', time_24hr: true, defaultDate: new Date(), disableMobile: false });
  const vin = $('a-venue'), vres = $('a-venue-results'), cin = $('a-category'), cres = $('a-cat-results');
  vin.oninput = async e => {
    const q = e.target.value; if (q.length < 2) { vres.style.display = 'none'; return; }
    const rows = await (await fetch('/api/manage/venues?q=' + encodeURIComponent(q))).json();
    if (!rows.length) { vres.style.display = 'none'; return; }
    vres.innerHTML = rows.map((r, i) => `<div class="ac-item" data-i="${i}"><b>${escHtml(r.DISPLAY_NAME)}</b><div class="ac-sub">${escHtml(r.ADDRESS || '')}</div></div>`).join('');
    vres.querySelectorAll('.ac-item').forEach((el, i) => el.onclick = async () => {
      const r = rows[i];
      if (r.FSQ_VENUEID && r.LAT) { const v = await VenuePick.resolve({ from: 'swarm', venue_id: r.FSQ_VENUEID, name: r.VENUE, sub: r.VENUE_SUB || '', lat: r.LAT, lng: r.LNG }); if (v) { vres.style.display = 'none'; applyVenue(v); return; } }
      vin.value = r.VENUE; setVal('a-venue-only', r.VENUE); setVal('a-venue-sub', r.VENUE_SUB || ''); setVal('a-category', r.CATEGORY || ''); setVal('a-address', r.ADDRESS || '');
      setVal('a-lat', r.LAT || ''); setVal('a-lng', r.LNG || ''); setVal('a-offset', r.FSQ_TIMEZONEOFFSET || 540); setVal('a-venue-id', r.FSQ_VENUEID || ''); setVal('a-country', r.COUNTRY || ''); setVal('a-countrycode', r.COUNTRYCODE || '');
      vres.style.display = 'none';
    });
    vres.style.display = 'block';
  };
  cin.oninput = async e => {
    const cats = await (await fetch('/api/manage/categories?q=' + encodeURIComponent(e.target.value))).json();
    if (!cats.length) { cres.style.display = 'none'; return; }
    cres.innerHTML = cats.map((c, i) => `<div class="ac-item" data-i="${i}">${escHtml(c)}</div>`).join('');
    cres.querySelectorAll('.ac-item').forEach((el, i) => el.onclick = () => { cin.value = cats[i]; cres.style.display = 'none'; });
    cres.style.display = 'block';
  };
  document.addEventListener('click', e => {
    if (!vin.contains(e.target) && !vres.contains(e.target)) vres.style.display = 'none';
    if (!cin.contains(e.target) && !cres.contains(e.target)) cres.style.display = 'none';
  });
}
async function submitAdd() {
  const venue = $('a-venue').value, time = $('a-time').value;
  if (!venue || !time) { alert('장소와 방문 시각은 꼭 넣어 주세요.'); return; }
  const g = id => $(id).value;
  const data = { venue_only: g('a-venue-only') || venue, venue_sub: g('a-venue-sub'), category: g('a-category'), address: g('a-address'), lat: g('a-lat'), lng: g('a-lng'),
    shout: g('a-shout'), time_local: time, timezone_offset: g('a-offset'), fsq_venueid: g('a-venue-id'), country: g('a-country'), countrycode: g('a-countrycode'),
    kakao_place_id: g('a-kakao-place-id'), tmap_poi_id: g('a-tmap-poi-id'), resolved: g('a-resolved') === '1' };
  if (!data.lat || !data.lng) { alert('위치를 정해 주세요 (주소 옆 지도 버튼).'); return; }
  const btn = $('submit-btn'); btn.disabled = true; btn.textContent = '기록하는 중…';
  try {
    const r = await (await fetch('/api/manage/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json();
    if (r.success) {
      alert('기록했어요.\n' + (r.address || '') + '\n캘린더에는 1분 안에 올라가요.');
      ['a-venue', 'a-venue-sub', 'a-category', 'a-address', 'a-shout', 'a-venue-only', 'a-venue-id', 'a-country', 'a-countrycode', 'a-kakao-place-id', 'a-tmap-poi-id', 'a-lat', 'a-lng', 'a-resolved'].forEach(id => setVal(id, ''));
      $('a-note').textContent = ''; setVal('a-offset', 540);
      await reload();
    } else alert('기록하지 못했어요: ' + r.error);
  } catch (e) { alert('요청 중 문제가 생겼어요.'); }
  btn.disabled = false; btn.textContent = '기록하기';
}

/* ── 위치 고르기 ── */
function openMapPicker() {
  $('map-picker-overlay').classList.add('active');
  if (!pickerMapInst) {
    pickerMapInst = L.map('picker-map', { zoomControl: false }).setView([37.5665, 126.9780], 13);
    UI.baseMap(pickerMapInst);
    pickerMapInst.on('click', async e => {
      const lat = e.latlng.lat.toFixed(6), lng = e.latlng.lng.toFixed(6);
      pickerLat = lat; pickerLng = lng;
      if (pickerMarker) pickerMapInst.removeLayer(pickerMarker);
      pickerMarker = L.marker([lat, lng]).addTo(pickerMapInst);
      $('picker-addr-text').textContent = '주소 찾는 중…';
      showPickerCands(lat, lng, '');
      const g = await VenuePick.geocode(lat, lng);
      pickerAddr = g && g.address ? g.address : lat + ', ' + lng; pickerGeo = g;
      $('picker-addr-text').textContent = pickerAddr;
    });
  } else setTimeout(() => pickerMapInst.invalidateSize(), 100);
  const lat = $('a-lat').value, lng = $('a-lng').value;
  if (lat && lng) { pickerMapInst.setView([+lat, +lng], 15); if (pickerMarker) pickerMapInst.removeLayer(pickerMarker); pickerMarker = L.marker([+lat, +lng]).addTo(pickerMapInst); }
}
function closeMapPicker() { $('map-picker-overlay').classList.remove('active'); }
async function searchOnPicker() {
  const q = $('picker-search-input').value; if (!q) return;
  const c = pickerMapInst.getCenter();
  const all = await showPickerCands(c.lat.toFixed(6), c.lng.toFixed(6), q);
  if (all && all.some(x => x.from !== 'addr')) return;
  try {
    const data = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(q) + '&addressdetails=1')).json();
    if (!data || !data.length) { alert('위치를 찾을 수 없어요.'); return; }
    const lat = parseFloat(data[0].lat).toFixed(6), lng = parseFloat(data[0].lon).toFixed(6);
    pickerLat = lat; pickerLng = lng; pickerMapInst.setView([lat, lng], 16);
    if (pickerMarker) pickerMapInst.removeLayer(pickerMarker);
    pickerMarker = L.marker([lat, lng]).addTo(pickerMapInst);
    showPickerCands(lat, lng, '');
    const g = await VenuePick.geocode(lat, lng);
    pickerAddr = g && g.address ? g.address : (data[0].display_name || ''); pickerGeo = g;
    $('picker-addr-text').textContent = pickerAddr;
  } catch (e) { console.error(e); }
}
$('picker-search-input').onkeypress = e => { if (e.key === 'Enter') searchOnPicker(); };
function confirmLocation() {
  if (!pickerLat || !pickerLng) { alert('지도를 눌러 위치를 골라 주세요.'); return; }
  setVal('a-lat', pickerLat); setVal('a-lng', pickerLng); setVal('a-address', pickerAddr);
  if (pickerGeo) { setVal('a-country', pickerGeo.country || ''); setVal('a-countrycode', pickerGeo.cc || ''); }
  closeMapPicker();
}
function showPickerCands(lat, lng, q) {
  let box = $('picker-cands');
  if (!box) { box = document.createElement('div'); box.id = 'picker-cands'; box.style.cssText = 'margin:-4px 0 10px;max-height:30vh'; $('picker-addr-text').insertAdjacentElement('afterend', box); }
  return VenuePick.show(box, lat, lng, q, v => { applyVenue(v); closeMapPicker(); });
}
function applyVenue(v) {
  $('a-venue').value = v.name || '';
  setVal('a-venue-only', v.name || ''); setVal('a-venue-sub', v.sub || ''); setVal('a-category', v.category || ''); setVal('a-address', v.address || '');
  setVal('a-lat', (+v.lat).toFixed(7)); setVal('a-lng', (+v.lng).toFixed(7)); setVal('a-venue-id', v.venue_id || ''); setVal('a-country', v.country || '');
  setVal('a-countrycode', v.cc || ''); setVal('a-kakao-place-id', v.kakao_id || ''); setVal('a-tmap-poi-id', v.tmap_poi_id || ''); setVal('a-resolved', '1');
  $('a-note').textContent = v.note || '';
  if (!v.name) $('a-venue').focus();
}

/* ── 시작 ── */
async function reload() {
  await SI.load(); markerBy = new Map(); buildMarkers(); applyMapFilter();
  if ($('tab-history').classList.contains('active')) renderHistory();
}
window.addEventListener('ui:change', () => {
  themeColor();
  if (isHeat) applyMapFilter();
  if ($('tab-stats').classList.contains('active')) SI.renderStats($('tab-stats'), statsPeriod, { small: true });
});
window.addEventListener('load', async () => {
  UI.icons();
  initMap();
  player = makePlayback();
  initAddForm();
  try { await reload(); } catch (e) { $('tl-label').textContent = '기록을 못 불러왔어요'; }
  setTimeout(() => map.invalidateSize(), 300);
});
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
