<!DOCTYPE html>
<html lang="ko" data-theme="diary">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>기록 관리 — Swarm Insights</title>
<script src="/static/ui.js?v=3"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="/static/ui.css?v=3">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.NAVER_MAP_KEY_ID = {{ naver_map_key_id|tojson }};</script>
<script src="/static/naver-base.js?v=2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment-with-locales.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
<script src="/static/venue-pick.js?v=1"></script>
<script src="/static/si.js?v=3"></script>
</head>
<body>
<header class="gnb">
  <a class="gnb-brand" href="/"><span class="logo"><i data-lucide="map-pin"></i></span><b>Swarm Insights</b><small>기록 관리</small></a>
  <div class="gnb-sp"></div>
  <nav class="gnb-nav">
    <a href="/"><i data-lucide="map"></i><span class="tx">지도</span></a>
    <a href="/#stats"><i data-lucide="chart-no-axes-column"></i><span class="tx">통계</span></a>
    <a href="/manage" class="on"><i data-lucide="pencil-line"></i><span class="tx">기록 관리</span></a>
    <button class="only-ic" id="open-settings" title="설정" aria-label="설정"><i data-lucide="settings-2"></i></button>
    <a href="javascript:void(0)" class="only-ic" onclick="tinyauthLogout()" data-ts-logout="1" title="로그아웃" aria-label="로그아웃"><i data-lucide="log-out"></i></a>
  </nav>
</header>

<main class="mg"><div class="mg-in">
  <section class="mg-add">
    <h2>새 기록</h2>
    <div class="mg-form">
      <div class="field">
        <label for="add-venue">장소</label>
        <input type="text" id="add-venue" placeholder="이름으로 찾기" autocomplete="off">
        <input type="hidden" id="add-venue-only"><input type="hidden" id="add-venue-id"><input type="hidden" id="add-country"><input type="hidden" id="add-countrycode">
        <input type="hidden" id="add-kakao-place-id"><input type="hidden" id="add-tmap-poi-id"><input type="hidden" id="add-resolved">
        <div id="venue-results" class="ac"></div>
      </div>
      <div class="field"><label for="add-venue-sub">지점</label><input type="text" id="add-venue-sub" placeholder="예: 강남점"></div>
      <div class="field">
        <label for="add-category">분류</label>
        <input type="text" id="add-category" autocomplete="off">
        <div id="category-results" class="ac"></div>
      </div>
      <div class="field">
        <label for="add-address">주소</label>
        <input type="text" id="add-address" placeholder="지도 버튼으로 고르기" style="padding-right:34px">
        <button class="loc-btn" type="button" title="지도에서 위치 고르기" onclick="openMapModal()"><i data-lucide="map-pinned"></i></button>
      </div>
      <input type="hidden" id="add-lat"><input type="hidden" id="add-lng"><input type="hidden" id="add-offset" value="540">
      <div class="field"><label for="add-time">방문 시각</label><input type="text" id="add-time" placeholder="날짜와 시각"></div>
      <div class="field"><label for="add-shout">메모</label><input type="text" id="add-shout" placeholder="한 줄 남기기"></div>
      <button class="btn" onclick="submitAdd()"><i data-lucide="plus"></i>기록하기</button>
    </div>
    <div class="mg-note" id="add-note"></div>
  </section>

  <section class="mg-list">
    <div class="mg-head">
      <h2>지난 기록 <small id="total" class="num" style="font-size:13px;color:var(--text-3);font-weight:600"></small></h2>
      <label class="gnb-search"><i data-lucide="search"></i><input type="search" id="list-search" placeholder="장소·주소 찾기" autocomplete="off"><button class="ib" id="clear-search" onclick="clearSearch()" style="display:none;width:24px;height:24px" aria-label="지우기"><i data-lucide="x"></i></button></label>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th style="width:150px">방문 시각</th><th style="width:200px">장소</th><th style="width:130px">분류</th><th>주소</th><th>메모</th><th></th></tr></thead>
        <tbody id="manage-list-body"></tbody>
      </table>
    </div>
    <div class="pagination"></div>
  </section>
</div></main>

<div id="map-modal" class="dlg">
  <div class="dlg-head" id="map-modal-header"><b>위치 고르기</b><button class="ib close-modal" onclick="closeMapModal()" aria-label="닫기"><i data-lucide="x"></i></button></div>
  <div class="dlg-body">
    <div class="dlg-row"><input type="text" class="inp" id="map-search-input" placeholder="장소 이름이나 주소"><button class="btn" onclick="searchOnMap()"><i data-lucide="search"></i>찾기</button></div>
    <div id="mini-map"></div>
    <p class="hint">지도를 누르면 그 근처 장소(내 기록 · 포스퀘어 · 카카오)가 나와요. 고르면 주소까지 채워져요.</p>
    <div id="map-cands"></div>
  </div>
</div>

<script>
moment.locale('ko');
const ic = UI.ic;
let currentPage = 1, totalRecords = 0, currentItems = [];
const limit = 20;
let map, marker;

function initMap() {
  map = L.map('mini-map').setView([37.5665, 126.9780], 13);
  UI.baseMap(map);
  map.on('click', e => setCoords(e.latlng.lat.toFixed(6), e.latlng.lng.toFixed(6)));
  initDraggable(document.getElementById('map-modal'));
}
function openMapModal() {
  document.getElementById('map-modal').style.display = 'flex';
  setTimeout(() => map.invalidateSize(), 100);
  const editRow = document.querySelector('.row-edit');
  let lat, lng;
  if (editRow) { const id = editRow.id.replace('row-', ''); lat = document.getElementById(`edit-lat-${id}`).value; lng = document.getElementById(`edit-lng-${id}`).value; }
  else { lat = document.getElementById('add-lat').value; lng = document.getElementById('add-lng').value; }
  if (lat && lng) { const p = [parseFloat(lat), parseFloat(lng)]; map.setView(p, 16); if (marker) map.removeLayer(marker); marker = L.marker(p).addTo(map); }
}
function closeMapModal() { document.getElementById('map-modal').style.display = 'none'; }
function initDraggable(el) {
  let x0 = 0, y0 = 0;
  const h = document.getElementById(el.id + '-header');
  h.onmousedown = e => {
    if (e.target.closest('.close-modal')) return;
    e.preventDefault(); x0 = e.clientX; y0 = e.clientY;
    document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
    document.onmousemove = ev => { ev.preventDefault(); const dx = x0 - ev.clientX, dy = y0 - ev.clientY; x0 = ev.clientX; y0 = ev.clientY;
      el.style.top = (el.offsetTop - dy) + 'px'; el.style.left = (el.offsetLeft - dx) + 'px'; el.style.transform = 'none'; };
  };
}
function applyAddress(lat, lng, addr, raw) {
  const editRow = document.querySelector('.row-edit');
  if (editRow) {
    const id = editRow.id.replace('row-', '');
    document.getElementById(`edit-lat-${id}`).value = lat; document.getElementById(`edit-lng-${id}`).value = lng; document.getElementById(`edit-address-${id}`).value = addr;
  } else {
    document.getElementById('add-lat').value = lat; document.getElementById('add-lng').value = lng; document.getElementById('add-address').value = addr;
    if (raw) {
      const cc = (raw.country_code || '').toUpperCase();
      document.getElementById('add-country').value = raw.country || ''; document.getElementById('add-countrycode').value = cc;
      if (cc === 'KR') document.getElementById('add-offset').value = 540;
    }
  }
  if (marker) map.removeLayer(marker);
  marker = L.marker([lat, lng]).addTo(map);
}
async function searchOnMap() {
  const q = document.getElementById('map-search-input').value; if (!q) return;
  const c = map.getCenter();
  const all = await VenuePick.show(document.getElementById('map-cands'), c.lat.toFixed(6), c.lng.toFixed(6), q, pickVenue);
  if (all && all.some(x => x.from !== 'addr')) return;
  const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&addressdetails=1`);
  const data = await res.json();
  if (data && data.length) { const lat = parseFloat(data[0].lat).toFixed(6), lng = parseFloat(data[0].lon).toFixed(6); map.setView([lat, lng], 16); setCoords(lat, lng); }
  else alert('위치를 찾을 수 없어요.');
}
document.getElementById('map-search-input').onkeypress = e => { if (e.key === 'Enter') searchOnMap(); };
async function setCoords(lat, lng) {
  if (marker) map.removeLayer(marker);
  marker = L.marker([lat, lng]).addTo(map);
  VenuePick.show(document.getElementById('map-cands'), lat, lng, '', pickVenue);
  const g = await VenuePick.geocode(lat, lng);
  applyAddress(lat, lng, g ? g.address : '', g ? { country: g.country, country_code: g.cc } : null);
}
// 후보를 고르면 서버 규칙으로 정한 값으로 채움
function pickVenue(v) {
  const editRow = document.querySelector('.row-edit');
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val == null ? '' : val; };
  const lat = (+v.lat).toFixed(7), lng = (+v.lng).toFixed(7);
  if (editRow) {
    const id = editRow.id.replace('row-', '');
    if (v.name) set(`edit-venue-${id}`, v.name);
    set(`edit-venue-sub-${id}`, v.sub);
    if (v.category) set(`edit-category-${id}`, v.category);
    set(`edit-address-${id}`, v.address); set(`edit-lat-${id}`, lat); set(`edit-lng-${id}`, lng);
    set(`edit-venue-id-${id}`, v.venue_id); set(`edit-country-${id}`, v.country); set(`edit-countrycode-${id}`, v.cc);
    set(`edit-kakao-place-id-${id}`, v.kakao_id); set(`edit-tmap-poi-id-${id}`, v.tmap_poi_id);
  } else {
    venueInput.value = v.name || '';
    set('add-venue-only', v.name); set('add-venue-sub', v.sub); set('add-category', v.category);
    set('add-address', v.address); set('add-lat', lat); set('add-lng', lng);
    set('add-venue-id', v.venue_id); set('add-country', v.country); set('add-countrycode', v.cc);
    set('add-kakao-place-id', v.kakao_id); set('add-tmap-poi-id', v.tmap_poi_id); set('add-resolved', '1');
    document.getElementById('add-note').textContent = v.note || '';
    if (!v.name) venueInput.focus();
  }
  if (marker) map.removeLayer(marker);
  marker = L.marker([+v.lat, +v.lng]).addTo(map);
  closeMapModal();
}

async function fetchList() {
  const q = document.getElementById('list-search').value;
  const res = await fetch(`/api/manage/list?page=${currentPage}&limit=${limit}&q=${encodeURIComponent(q)}`);
  const r = await res.json();
  totalRecords = r.total; currentItems = r.data;
  document.getElementById('total').textContent = totalRecords.toLocaleString() + '건';
  renderList(currentItems); updatePagination();
}
const E = SI.esc;
function renderList(data) {
  const body = document.getElementById('manage-list-body');
  body.innerHTML = data.length ? data.map(d => `<tr id="row-${E(d.FSQ_ID)}">
      <td class="t">${moment(d.TIME_LOCAL).format('YY.MM.DD (dd) HH:mm')}</td>
      <td class="v">${E(d.VENUE)}</td>
      <td class="m">${E(d.CATEGORY || '–')}</td>
      <td class="m">${E(d.ADDRESS || '–')}</td>
      <td class="s">${E(d.SHOUT || '')}</td>
      <td class="a"><button class="ib" onclick="startEdit('${E(d.FSQ_ID)}')" title="고치기" aria-label="고치기">${ic('pencil')}</button><button class="ib del" onclick="deleteCheckin('${E(d.FSQ_ID)}','${E(d.GCal_EventID || '')}')" title="지우기" aria-label="지우기">${ic('trash-2')}</button></td>
    </tr>`).join('') : '<tr><td colspan="6" class="vempty">찾는 기록이 없어요</td></tr>';
}
function startEdit(id) {
  if (document.querySelector('.row-edit')) renderList(currentItems);
  const row = document.getElementById(`row-${id}`), it = currentItems.find(x => x.FSQ_ID === id);
  row.classList.add('row-edit');
  row.innerHTML = `
    <td><input type="text" class="inp" id="edit-time-${id}" value="${E(it.TIME_LOCAL)}"></td>
    <td><input type="text" class="inp" id="edit-venue-${id}" value="${E(it.VENUE_ONLY)}"><input type="text" class="inp" id="edit-venue-sub-${id}" value="${E(it.VENUE_SUB || '')}" placeholder="지점"></td>
    <td><input type="text" class="inp" id="edit-category-${id}" value="${E(it.CATEGORY || '')}"></td>
    <td><div class="field"><input type="text" class="inp" id="edit-address-${id}" value="${E(it.ADDRESS || '')}" style="padding-right:34px"><button class="loc-btn" type="button" onclick="openMapModal()" title="지도에서 고르기">${ic('map-pinned')}</button></div></td>
    <td><input type="text" class="inp" id="edit-shout-${id}" value="${E(it.SHOUT || '')}">
      <input type="hidden" id="edit-lat-${id}" value="${E(it.LAT)}"><input type="hidden" id="edit-lng-${id}" value="${E(it.LNG)}">
      <input type="hidden" id="edit-offset-${id}" value="${E(it.FSQ_TIMEZONEOFFSET)}"><input type="hidden" id="edit-venue-id-${id}" value="">
      <input type="hidden" id="edit-country-${id}" value="${E(it.COUNTRY || '')}"><input type="hidden" id="edit-countrycode-${id}" value="${E(it.COUNTRYCODE || '')}">
      <input type="hidden" id="edit-kakao-place-id-${id}" value=""><input type="hidden" id="edit-tmap-poi-id-${id}" value=""></td>
    <td class="a"><button class="ib ok" onclick="submitEdit('${E(id)}','${E(it.GCal_EventID || '')}')" title="저장" aria-label="저장">${ic('check')}</button><button class="ib" onclick="fetchList()" title="취소" aria-label="취소">${ic('x')}</button></td>`;
  flatpickr(`#edit-time-${id}`, { enableTime: true, dateFormat: 'Y-m-d H:i', altInput: true, altFormat: 'Y-m-d (D) H:i', locale: 'ko', time_24hr: true, defaultDate: it.TIME_LOCAL, altInputClass: 'inp' });
}
async function submitEdit(id, gcalId) {
  const it = currentItems.find(x => x.FSQ_ID === id), v = k => document.getElementById(`edit-${k}-${id}`).value;
  const data = {
    venue_only: v('venue'), venue_sub: v('venue-sub'), category: v('category'), address: v('address'), lat: v('lat'), lng: v('lng'), shout: v('shout'),
    time_local: v('time') + ':00', timezone_offset: v('offset'), gcal_eventid: gcalId, fsq_unixtime: it.FSQ_UNIXTIME,
    fsq_venueid: v('venue-id'), country: v('country'), countrycode: v('countrycode'), kakao_place_id: v('kakao-place-id'), tmap_poi_id: v('tmap-poi-id'),
  };
  const res = await fetch(`/api/manage/update/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const r = await res.json();
  if (r.success) fetchList(); else alert('저장하지 못했어요: ' + r.error);
}
function updatePagination() {
  const maxPage = Math.ceil(totalRecords / limit) || 1, p = document.querySelector('.pagination');
  let s = Math.max(1, currentPage - 5), e = Math.min(maxPage, currentPage + 4);
  if (e - s < 9) { if (s === 1) e = Math.min(maxPage, s + 9); else if (e === maxPage) s = Math.max(1, e - 9); }
  let h = `<button class="pg" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">${ic('chevron-left')}이전</button>`;
  for (let i = s; i <= e; i++) h += `<button class="pg${i === currentPage ? ' is-on' : ''}" onclick="goToPage(${i})">${i}</button>`;
  h += `<button class="pg" ${currentPage >= maxPage ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">다음${ic('chevron-right')}</button>`;
  p.innerHTML = h;
}
function goToPage(n) { if (n >= 1 && n <= (Math.ceil(totalRecords / limit) || 1)) { currentPage = n; fetchList(); } }
let lt = null;
document.getElementById('list-search').oninput = e => {
  document.getElementById('clear-search').style.display = e.target.value ? 'inline-flex' : 'none';
  currentPage = 1; clearTimeout(lt); lt = setTimeout(fetchList, 200);
};
function clearSearch() { document.getElementById('list-search').value = ''; document.getElementById('clear-search').style.display = 'none'; currentPage = 1; fetchList(); }

const venueInput = document.getElementById('add-venue'), venueResults = document.getElementById('venue-results');
const categoryInput = document.getElementById('add-category'), categoryResults = document.getElementById('category-results');
venueInput.oninput = async e => {
  const q = e.target.value;
  if (q.length < 2) { venueResults.style.display = 'none'; return; }
  const data = await (await fetch(`/api/manage/venues?q=${encodeURIComponent(q)}`)).json();
  if (!data.length) { venueResults.style.display = 'none'; return; }
  venueResults.innerHTML = '';
  data.forEach(item => {
    const div = document.createElement('div');
    div.className = 'result-item';
    div.innerHTML = `<div><b>${E(item.DISPLAY_NAME)}</b></div><div class="addr">${E(item.ADDRESS || '')}</div>`;
    div.onclick = async () => {
      if (item.FSQ_VENUEID && item.LAT) {
        const v = await VenuePick.resolve({ from: 'swarm', venue_id: item.FSQ_VENUEID, name: item.VENUE, sub: item.VENUE_SUB || '', lat: item.LAT, lng: item.LNG });
        if (v) { venueResults.style.display = 'none'; pickVenue(v); return; }
      }
      venueInput.value = item.VENUE;
      const set = (id, val) => document.getElementById(id).value = val;
      set('add-venue-only', item.VENUE); set('add-venue-sub', item.VENUE_SUB || ''); set('add-category', item.CATEGORY || '');
      set('add-address', item.ADDRESS || ''); set('add-lat', item.LAT || ''); set('add-lng', item.LNG || ''); set('add-offset', item.FSQ_TIMEZONEOFFSET || 540);
      set('add-venue-id', item.FSQ_VENUEID || ''); set('add-country', item.COUNTRY || ''); set('add-countrycode', item.COUNTRYCODE || '');
      venueResults.style.display = 'none';
    };
    venueResults.appendChild(div);
  });
  venueResults.style.display = 'block';
};
categoryInput.oninput = async e => {
  const data = await (await fetch(`/api/manage/categories?q=${encodeURIComponent(e.target.value)}`)).json();
  if (!data.length) { categoryResults.style.display = 'none'; return; }
  categoryResults.innerHTML = '';
  data.forEach(cat => { const d = document.createElement('div'); d.className = 'result-item'; d.textContent = cat; d.onclick = () => { categoryInput.value = cat; categoryResults.style.display = 'none'; }; categoryResults.appendChild(d); });
  categoryResults.style.display = 'block';
};
document.addEventListener('click', e => {
  if (!venueInput.contains(e.target) && !venueResults.contains(e.target)) venueResults.style.display = 'none';
  if (!categoryInput.contains(e.target) && !categoryResults.contains(e.target)) categoryResults.style.display = 'none';
});
async function submitAdd() {
  const timeLocal = document.getElementById('add-time').value.replace('T', ' ');
  if (!venueInput.value || !timeLocal) { alert('장소와 방문 시각은 꼭 넣어 주세요.'); return; }
  const g = id => document.getElementById(id).value;
  const data = {
    venue_only: g('add-venue-only') || venueInput.value, venue_sub: g('add-venue-sub'), category: g('add-category'), address: g('add-address'),
    lat: g('add-lat'), lng: g('add-lng'), shout: g('add-shout'), time_local: timeLocal, timezone_offset: g('add-offset'),
    fsq_venueid: g('add-venue-id'), country: g('add-country'), countrycode: g('add-countrycode'),
    kakao_place_id: g('add-kakao-place-id'), tmap_poi_id: g('add-tmap-poi-id'), resolved: g('add-resolved') === '1',
  };
  if (!data.lat || !data.lng) { alert('위치를 정해 주세요 (주소 옆 지도 버튼).'); return; }
  const r = await (await fetch('/api/manage/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json();
  if (r.success) { alert('기록했어요.\n' + (r.address || '') + '\n캘린더에는 1분 안에 올라가요.'); location.reload(); } else alert('기록하지 못했어요: ' + r.error);
}
async function deleteCheckin(id, gcalId) {
  if (!confirm('이 기록을 지울까요? Swarm과 구글 캘린더에서도 지워져요.')) return;
  const r = await (await fetch(`/api/manage/delete/${id}?gcal_id=${gcalId}`, { method: 'DELETE' })).json();
  if (r.success) fetchList(); else alert('지우지 못했어요: ' + r.error);
}
document.getElementById('open-settings').onclick = () => UI.openSettings();
window.onload = () => {
  UI.icons(); initMap(); fetchList();
  flatpickr('#add-time', { enableTime: true, dateFormat: 'Y-m-d H:i', altInput: true, altFormat: 'Y-m-d (D) H:i', locale: 'ko', time_24hr: true, defaultDate: new Date() });
};
function tinyauthLogout() {
  fetch('https://auth.b-612.kr/api/user/logout', { method: 'POST', credentials: 'include' }).finally(() => { window.location.href = 'https://auth.b-612.kr/login'; });
}
</script>
<script src="/static/ts.js" defer></script>
</body>
</html>
