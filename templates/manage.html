<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarm Insights - 체크인 관리</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment-with-locales.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
    <style>
        :root {
            --bg: #f5f5f7; --bg-card: #ffffff; --border: #d2d2d7; --text: #1d1d1f; --text-mute: #86868b; --secondary: #0071e3;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #1c1c1e; --bg-card: #2c2c2e; --border: #3a3a3c; --text: #f5f5f7; --text-mute: #8e8e93; }
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 1.8em; font-weight: 800; }
        .card { background: var(--bg-card); padding: 15px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; width: 100%; box-sizing: border-box; }
        .card h3 { margin: 0 0 12px 0; font-size: 1.05em; color: var(--text-mute); }
        
        /* Layout Grid */
        .manage-grid { display: flex; flex-direction: column; gap: 15px; }
        
        /* Horizontal Form Layout - Responsive Wrapping */
        .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; width: 100%; }
        .form-group { flex: 1; display: flex; flex-direction: column; gap: 4px; position: relative; min-width: 150px; margin-bottom: 5px; }
        .form-group.min-w { min-width: 80px; }
        .form-group label { font-size: 0.75em; font-weight: 700; color: var(--text-mute); white-space: nowrap; }
        .form-group input { padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; width: 100%; box-sizing: border-box; font-size: 0.85em; }
        .btn-primary { background: var(--secondary); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 0.85em; height: 34px; align-self: flex-end; margin-bottom: 5px; }
        
        /* Hover Map Trigger */
        .location-group { position: relative; }
        .hover-map-btn {
            position: absolute; right: 5px; top: 50%; transform: translateY(-10%);
            background: var(--bg-card); border: 1px solid var(--border); color: var(--secondary);
            width: 24px; height: 24px; border-radius: 6px; display: none;
            align-items: center; justify-content: center; cursor: pointer; z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .location-group:hover .hover-map-btn { display: flex; }
        .hover-map-btn:hover { background: var(--secondary); color: white; }

        /* Autocomplete */
        .autocomplete-results { position: absolute; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; width: 100%; z-index: 1000; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); top: 100%; left: 0; max-height: 300px; overflow-y: auto; }
        .result-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid var(--border); }
        .result-item:hover { background: var(--bg); }
        .result-item .addr { font-size: 0.75em; color: var(--text-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Table Layout */
        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.82em; }
        th { color: var(--text-mute); font-weight: 600; background: var(--bg); }
        .row-edit input { width: 100%; padding: 4px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.85em; }
        
        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 15px; }
        .btn-nav { background: var(--bg-card); border: 1px solid var(--border); padding: 5px 10px; border-radius: 8px; cursor: pointer; color: var(--text); font-size: 0.85em; }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Icons for actions */
        .btn-sm { padding: 5px 8px; border-radius: 6px; font-size: 0.9em; cursor: pointer; border: none; margin-right: 3px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-edit { background: #0071e3; color: white; }
        .btn-delete { background: #ff3b30; color: white; }
        .btn-save { background: #34c759; color: white; }
        .btn-cancel { background: var(--text-mute); color: white; }
        
        /* Draggable Modal Style */
        #map-modal {
            display: none; position: fixed; top: 15%; left: 50%; width: 500px; 
            transform: translateX(-50%);
            background: var(--bg-card); z-index: 2000; 
            border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
            border: 1px solid var(--border);
            flex-direction: column;
            resize: both; overflow: auto;
            min-width: 350px; min-height: 400px;
        }
        .modal-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 15px; border-bottom: 1px solid var(--border);
            cursor: move; background: var(--bg); border-radius: 20px 20px 0 0;
        }
        .close-modal { cursor: pointer; font-size: 1.2em; color: var(--text-mute); }
        .modal-body { padding: 15px; flex: 1; display: flex; flex-direction: column; }
        #mini-map { height: 350px; width: 100%; border-radius: 12px; border: 1px solid var(--border); flex: 1; }
        
        .search-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .search-row input { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); width: 200px; font-size: 0.85em; }

        input[type="datetime-local"] { cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-list-check"></i> 체크인 관리</h1>
            <a href="/" class="btn-primary" style="text-decoration:none; display: flex; align-items: center; gap: 5px; height: auto;"><i class="fa-solid fa-map"></i> 지도로 돌아가기</a>
        </div>

        <div class="manage-grid">
            <!-- Add Section -->
            <div class="card">
                <h3><i class="fa-solid fa-plus-circle"></i> 새 체크인 추가</h3>
                <div class="form-row">
                    <div class="form-group" style="flex: 1.5;">
                        <label>장소명</label>
                        <input type="text" id="add-venue" placeholder="검색/입력" autocomplete="off">
                        <input type="hidden" id="add-venue-only">
                        <input type="hidden" id="add-venue-id">
                        <input type="hidden" id="add-country">
                        <input type="hidden" id="add-countrycode">
                        <div id="venue-results" class="autocomplete-results"></div>
                    </div>
                    <div class="form-group min-w" style="flex: 0.6;"><label>지점</label><input type="text" id="add-venue-sub" placeholder="점"></div>
                    <div class="form-group min-w" style="flex: 0.8;">
                        <label>카테고리</label>
                        <input type="text" id="add-category" autocomplete="off">
                        <div id="category-results" class="autocomplete-results"></div>
                    </div>
                    <div class="form-group location-group" style="flex: 2;">
                        <label>주소</label>
                        <input type="text" id="add-address" placeholder="주소">
                        <div class="hover-map-btn" title="지도에서 위치 선택" onclick="openMapModal()"><i class="fa-solid fa-map-location-dot"></i></div>
                    </div>
                    <input type="hidden" id="add-lat">
                    <input type="hidden" id="add-lng">
                    <input type="hidden" id="add-offset" value="540">
                    <div class="form-group" style="flex: 1.1; min-width: 160px;"><label>방문시간</label><input type="text" id="add-time" placeholder="날짜와 시간 선택"></div>
                    <div class="form-group" style="flex: 1.5;"><label>내용 (Shout)</label><input type="text" id="add-shout"></div>
                    <button class="btn-primary" onclick="submitAdd()">등록</button>
                </div>
            </div>

            <!-- List Section -->
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <h3 style="margin:0;"><i class="fa-solid fa-history"></i> 체크인 히스토리</h3>
                    <div class="search-row" style="position: relative; display: inline-flex; align-items: center;">
                        <input type="text" id="list-search" placeholder="검색 (장소, 주소)..." style="padding-right: 25px;">
                        <i class="fa-solid fa-circle-xmark" id="clear-search" style="position: absolute; right: 8px; cursor: pointer; color: var(--text-mute); display: none;" onclick="clearSearch()"></i>
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:110px;">시간(L)</th>
                                <th style="width:140px;">장소</th>
                                <th style="width:80px;">카테고리</th>
                                <th>주소</th>
                                <th>내용</th>
                                <th style="width:70px;">관리</th>
                            </tr>
                        </thead>
                        <tbody id="manage-list-body"></tbody>
                    </table>
                </div>
                <div class="pagination">
                </div>
            </div>
        </div>
    </div>

    <!-- Draggable Map Modal -->
    <div id="map-modal">
        <div class="modal-header" id="map-modal-header">
            <h3 style="margin:0; font-size: 0.95em;"><i class="fa-solid fa-map-location-dot"></i> 위치 선택</h3>
            <i class="fa-solid fa-xmark close-modal" onclick="closeMapModal()"></i>
        </div>
        <div class="modal-body">
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <input type="text" id="map-search-input" placeholder="장소명 또는 주소 검색..." style="flex:1; padding:8px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size: 0.85em; outline:none;">
                <button class="btn-primary" onclick="searchOnMap()" style="padding:0 15px; height:36px; margin-bottom: 0;"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div id="mini-map"></div>
            <p style="font-size:0.8em; color:var(--text-mute); margin-top:8px; margin-bottom: 0;">지도 클릭 시 주소와 좌표가 자동 입력됩니다.</p>
        </div>
    </div>

    <script>
        moment.locale('ko');
        let currentPage = 1;
        const limit = 20;
        let totalRecords = 0;
        let currentItems = [];
        let map, marker;

        function initMap() {
            map = L.map('mini-map').setView([37.5665, 126.9780], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(map);
            
            map.on('click', (e) => {
                const lat = e.latlng.lat.toFixed(6);
                const lng = e.latlng.lng.toFixed(6);
                setCoords(lat, lng);
            });
            initDraggable(document.getElementById("map-modal"));
        }

        function openMapModal() {
            const modal = document.getElementById('map-modal');
            modal.style.display = 'flex';
            setTimeout(() => map.invalidateSize(), 100);
            
            const editRow = document.querySelector('.row-edit');
            let lat, lng;
            if (editRow) {
                const fsqId = editRow.id.replace('row-', '');
                lat = document.getElementById(`edit-lat-${fsqId}`).value;
                lng = document.getElementById(`edit-lng-${fsqId}`).value;
            } else {
                lat = document.getElementById('add-lat').value;
                lng = document.getElementById('add-lng').value;
            }
            if (lat && lng) {
                const pos = [parseFloat(lat), parseFloat(lng)];
                map.setView(pos, 16);
                if (marker) map.removeLayer(marker);
                marker = L.marker(pos).addTo(map);
            }
        }

        function closeMapModal() {
            document.getElementById('map-modal').style.display = 'none';
        }

        function initDraggable(el) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const header = document.getElementById(el.id + "-header");
            if (header) {
                header.onmousedown = dragMouseDown;
            } else {
                el.onmousedown = dragMouseDown;
            }

            function dragMouseDown(e) {
                e = e || window.event;
                if (e.target.classList.contains('close-modal')) return;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                el.style.top = (el.offsetTop - pos2) + "px";
                el.style.left = (el.offsetLeft - pos1) + "px";
                el.style.transform = "none";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        function formatAddress(addr, fallback) {
            if (!addr) return fallback || '';
            const postcode = addr.postcode || '';
            const country = addr.country || '';
            const city = addr.city || addr.town || addr.village || addr.county || '';
            
            const restParts = [];
            const parts = ['road', 'suburb', 'neighbourhood', 'quarter', 'city_district'];
            parts.forEach(p => { if (addr[p]) restParts.push(addr[p]); });
            if (addr.house_number && restParts.length > 0) restParts[0] = restParts[0] + ' ' + addr.house_number;
            else if (addr.house_number) restParts.push(addr.house_number);

            const rest = restParts.join(' ');
            return [postcode, country, city, rest].filter(x => x).join(' ').trim();
        }

        function applyAddress(lat, lng, formattedAddr, rawAddr) {
            const editRow = document.querySelector('.row-edit');
            const isEdit = !!editRow;
            
            if (isEdit) {
                const fsqId = editRow.id.replace('row-', '');
                document.getElementById(`edit-lat-${fsqId}`).value = lat;
                document.getElementById(`edit-lng-${fsqId}`).value = lng;
                document.getElementById(`edit-address-${fsqId}`).value = formattedAddr;
            } else {
                document.getElementById('add-lat').value = lat;
                document.getElementById('add-lng').value = lng;
                document.getElementById('add-address').value = formattedAddr;
                
                if (rawAddr) {
                    const country = rawAddr.country || '';
                    const countryCode = (rawAddr.country_code || '').toUpperCase();
                    document.getElementById('add-country').value = country;
                    document.getElementById('add-countrycode').value = countryCode;
                    if (countryCode === 'KR') document.getElementById('add-offset').value = 540;
                }
            }

            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);
        }

        async function searchOnMap() {
            const q = document.getElementById('map-search-input').value;
            if (!q) return;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&addressdetails=1`);
            const data = await res.json();
            if (data && data.length > 0) {
                const item = data[0];
                const lat = parseFloat(item.lat).toFixed(6);
                const lng = parseFloat(item.lon).toFixed(6);
                map.setView([lat, lng], 16);
                const formattedAddr = formatAddress(item.address, item.display_name);
                applyAddress(lat, lng, formattedAddr, item.address);
            } else {
                alert('위치를 찾을 수 없습니다.');
            }
        }

        document.getElementById('map-search-input').onkeypress = (e) => {
            if (e.key === 'Enter') searchOnMap();
        };

        async function setCoords(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1`);
                const data = await res.json();
                const formattedAddr = formatAddress(data.address, data.display_name);
                applyAddress(lat, lng, formattedAddr, data.address);
            } catch(e) { 
                console.error("Geocoding Error", e);
                applyAddress(lat, lng, "", null);
            }
        }

        async function fetchList() {
            const q = document.getElementById('list-search').value;
            const res = await fetch(`/api/manage/list?page=${currentPage}&limit=${limit}&q=${encodeURIComponent(q)}`);
            const result = await res.json();
            totalRecords = result.total;
            currentItems = result.data;
            renderList(currentItems);
            updatePagination();
        }

        function renderList(data) {
            const body = document.getElementById('manage-list-body');
            body.innerHTML = '';
            data.forEach(d => {
                const tr = document.createElement('tr');
                tr.id = `row-${d.FSQ_ID}`;
                tr.innerHTML = `
                    <td>${moment(d.TIME_LOCAL).format('YY-MM-DD (dd) HH:mm')}</td>
                    <td><b>${d.VENUE}</b></td>
                    <td>${d.CATEGORY || '-'}</td>
                    <td><span style="font-size:0.85em">${d.ADDRESS || '-'}</span></td>
                    <td><span style="font-size:0.85em">${d.SHOUT || ''}</span></td>
                    <td style="white-space:nowrap;">
                        <button class="btn-sm btn-edit" onclick="startEdit('${d.FSQ_ID}')" title="수정"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="btn-sm btn-delete" onclick="deleteCheckin('${d.FSQ_ID}', '${d.GCal_EventID || ''}')" title="삭제"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                body.appendChild(tr);
            });
        }

        function startEdit(fsqId) {
            if (document.querySelector('.row-edit')) {
                renderList(currentItems);
            }
            const row = document.getElementById(`row-${fsqId}`);
            const item = currentItems.find(x => x.FSQ_ID === fsqId);
            
            row.classList.add('row-edit');
            row.innerHTML = `
                <td><input type="text" id="edit-time-${fsqId}" value="${item.TIME_LOCAL}"></td>
                <td><input type="text" id="edit-venue-${fsqId}" value="${item.VENUE_ONLY}"><br><input type="text" id="edit-venue-sub-${fsqId}" value="${item.VENUE_SUB || ''}" placeholder="지점명"></td>
                <td><input type="text" id="edit-category-${fsqId}" value="${item.CATEGORY || ''}"></td>
                <td>
                    <div class="location-group">
                        <input type="text" id="edit-address-${fsqId}" value="${item.ADDRESS || ''}">
                        <div class="hover-map-btn" onclick="openMapModal()"><i class="fa-solid fa-map-location-dot"></i></div>
                    </div>
                </td>
                <td>
                    <input type="text" id="edit-shout-${fsqId}" value="${item.SHOUT || ''}">
                    <input type="hidden" id="edit-lat-${fsqId}" value="${item.LAT}">
                    <input type="hidden" id="edit-lng-${fsqId}" value="${item.LNG}">
                    <input type="hidden" id="edit-offset-${fsqId}" value="${item.FSQ_TIMEZONEOFFSET}">
                </td>
                <td style="white-space:nowrap;">
                    <button class="btn-sm btn-save" onclick="submitEdit('${fsqId}', '${item.GCal_EventID || ''}')" title="저장"><i class="fa-solid fa-check"></i></button>
                    <button class="btn-sm btn-cancel" onclick="fetchList()" title="취소"><i class="fa-solid fa-xmark"></i></button>
                </td>
            `;
            flatpickr(`#edit-time-${fsqId}`, {
                enableTime: true,
                dateFormat: "Y-m-d H:i",
                altInput: true,
                altFormat: "Y-m-d (D) H:i",
                locale: "ko",
                time_24hr: true,
                defaultDate: item.TIME_LOCAL
            });
        }

        async function submitEdit(fsqId, gcalId) {
            const item = currentItems.find(x => x.FSQ_ID === fsqId);
            const timeVal = document.getElementById(`edit-time-${fsqId}`).value;
            // The value is already in YYYY-MM-DD HH:mm format from Flatpickr's dateFormat
            const parsedTime = timeVal + ":00"; 

            const data = {
                venue_only: document.getElementById(`edit-venue-${fsqId}`).value,
                venue_sub: document.getElementById(`edit-venue-sub-${fsqId}`).value,
                category: document.getElementById(`edit-category-${fsqId}`).value,
                address: document.getElementById(`edit-address-${fsqId}`).value,
                lat: document.getElementById(`edit-lat-${fsqId}`).value,
                lng: document.getElementById(`edit-lng-${fsqId}`).value,
                shout: document.getElementById(`edit-shout-${fsqId}`).value,
                time_local: parsedTime,
                timezone_offset: document.getElementById(`edit-offset-${fsqId}`).value,
                gcal_eventid: gcalId,
                fsq_unixtime: item.FSQ_UNIXTIME
            };
            const res = await fetch(`/api/manage/update/${fsqId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const result = await res.json();
            if (result.success) { fetchList(); } else { alert('에러: ' + result.error); }
        }

        function updatePagination() {
            const maxPage = Math.ceil(totalRecords / limit) || 1;
            const pagination = document.querySelector('.pagination');
            pagination.innerHTML = '';
            
            let startPage = Math.max(1, currentPage - 5);
            let endPage = Math.min(maxPage, currentPage + 4);
            
            if (endPage - startPage < 9) {
                if (startPage === 1) endPage = Math.min(maxPage, startPage + 9);
                else if (endPage === maxPage) startPage = Math.max(1, endPage - 9);
            }

            const prevBtn = document.createElement('button');
            prevBtn.className = 'btn-nav';
            prevBtn.disabled = currentPage === 1;
            prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i> 이전';
            prevBtn.onclick = () => goToPage(currentPage - 1);
            pagination.appendChild(prevBtn);

            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = 'btn-nav';
                if (i === currentPage) {
                    pageBtn.style.background = 'var(--secondary)';
                    pageBtn.style.color = 'white';
                }
                pageBtn.innerText = i;
                pageBtn.onclick = () => goToPage(i);
                pagination.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn-nav';
            nextBtn.disabled = currentPage >= maxPage;
            nextBtn.innerHTML = '다음 <i class="fa-solid fa-chevron-right"></i>';
            nextBtn.onclick = () => goToPage(currentPage + 1);
            pagination.appendChild(nextBtn);
        }

        function goToPage(page) {
            if (page >= 1 && page <= (Math.ceil(totalRecords / limit) || 1)) {
                currentPage = page;
                fetchList();
            }
        }

        document.getElementById('list-search').oninput = (e) => {
            document.getElementById('clear-search').style.display = e.target.value ? 'block' : 'none';
            currentPage = 1;
            fetchList();
        };

        function clearSearch() {
            document.getElementById('list-search').value = '';
            document.getElementById('clear-search').style.display = 'none';
            currentPage = 1;
            fetchList();
        }

        const venueInput = document.getElementById('add-venue');
        const venueResults = document.getElementById('venue-results');
        const categoryInput = document.getElementById('add-category');
        const categoryResults = document.getElementById('category-results');

        // Venue Autocomplete
        venueInput.oninput = async (e) => {
            const q = e.target.value;
            if (q.length < 2) { venueResults.style.display = 'none'; return; }
            const res = await fetch(`/api/manage/venues?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            if (data.length > 0) {
                venueResults.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = `<div><b>${item.DISPLAY_NAME}</b></div><div class="addr">${item.ADDRESS || ''}</div>`;
                    div.onclick = () => {
                        venueInput.value = item.VENUE; // Base venue name only
                        document.getElementById('add-venue-only').value = item.VENUE;
                        document.getElementById('add-venue-sub').value = item.VENUE_SUB || '';
                        document.getElementById('add-category').value = item.CATEGORY || '';
                        document.getElementById('add-address').value = item.ADDRESS || '';
                        document.getElementById('add-lat').value = item.LAT || '';
                        document.getElementById('add-lng').value = item.LNG || '';
                        document.getElementById('add-offset').value = item.FSQ_TIMEZONEOFFSET || 540;
                        document.getElementById('add-venue-id').value = item.FSQ_VENUEID || '';
                        document.getElementById('add-country').value = item.COUNTRY || '';
                        document.getElementById('add-countrycode').value = item.COUNTRYCODE || '';
                        venueResults.style.display = 'none';
                    };
                    venueResults.appendChild(div);
                });
                venueResults.style.display = 'block';
            } else { venueResults.style.display = 'none'; }
        };

        // Category Autocomplete
        categoryInput.oninput = async (e) => {
            const q = e.target.value;
            const res = await fetch(`/api/manage/categories?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            if (data.length > 0) {
                categoryResults.innerHTML = '';
                data.forEach(cat => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = `<div>${cat}</div>`;
                    div.onclick = () => {
                        categoryInput.value = cat;
                        categoryResults.style.display = 'none';
                    };
                    categoryResults.appendChild(div);
                });
                categoryResults.style.display = 'block';
            } else { categoryResults.style.display = 'none'; }
        };

        // Close results on outside click
        document.addEventListener('click', (e) => {
            if (!venueInput.contains(e.target) && !venueResults.contains(e.target)) venueResults.style.display = 'none';
            if (!categoryInput.contains(e.target) && !categoryResults.contains(e.target)) categoryResults.style.display = 'none';
        });

        async function submitAdd() {
            const timeLocal = document.getElementById('add-time').value.replace('T', ' ');
            if (!venueInput.value || !timeLocal) { alert('장소명과 방문시간은 필수입니다.'); return; }
            let venueOnly = document.getElementById('add-venue-only').value;
            if (!venueOnly) venueOnly = venueInput.value;
            const data = {
                venue_only: venueOnly,
                venue_sub: document.getElementById('add-venue-sub').value,
                category: document.getElementById('add-category').value,
                address: document.getElementById('add-address').value,
                lat: document.getElementById('add-lat').value,
                lng: document.getElementById('add-lng').value,
                shout: document.getElementById('add-shout').value,
                time_local: timeLocal,
                timezone_offset: document.getElementById('add-offset').value,
                fsq_venueid: document.getElementById('add-venue-id').value,
                country: document.getElementById('add-country').value,
                countrycode: document.getElementById('add-countrycode').value
            };
            const res = await fetch('/api/manage/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const result = await res.json();
            if (result.success) { alert('추가되었습니다.'); location.reload(); } else { alert('에러: ' + result.error); }
        }

        async function deleteCheckin(fsqId, gcalId) {
            if (!confirm('정말 삭제하시겠습니까? Swarm 및 구글 캘린더에서도 삭제됩니다.')) return;
            const res = await fetch(`/api/manage/delete/${fsqId}?gcal_id=${gcalId}`, { method: 'DELETE' });
            const result = await res.json();
            if (result.success) { fetchList(); } else { alert('에러: ' + result.error); }
        }

        window.onload = () => { 
            initMap(); 
            fetchList(); 
            flatpickr('#add-time', {
                enableTime: true,
                dateFormat: "Y-m-d H:i",
                altInput: true,
                altFormat: "Y-m-d (D) H:i",
                locale: "ko",
                time_24hr: true,
                defaultDate: new Date()
            });
        };
    </script>
</body>
</html>
