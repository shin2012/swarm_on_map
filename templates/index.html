<!DOCTYPE html>
<html lang="ko" data-theme="diary">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Swarm Insights</title>
<script src="/static/ui.js?v=3"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css">
<link rel="stylesheet" href="/static/ui.css?v=4">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.NAVER_MAP_KEY_ID = {{ naver_map_key_id|tojson }};</script>
<script src="/static/naver-base.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/ko.min.js"></script>
<script src="/static/si.js?v=4"></script>
<script src="/static/playback.js?v=3"></script>
</head>
<body>
<header class="gnb">
  <a class="gnb-brand" href="/"><span class="logo"><i data-lucide="map-pin"></i></span><b>Swarm Insights</b><small>방문 기록</small></a>
  <div class="gnb-range">기록 <b id="gnb-range">불러오는 중</b></div>
  <div class="gnb-clock" id="gnb-clock"></div>
  <div class="gnb-sp"></div>
  <label class="gnb-search"><i data-lucide="search"></i><input type="search" id="search-input" placeholder="장소·분류 찾기" autocomplete="off"></label>
  <nav class="gnb-nav">
    <a href="#" id="nav-map" class="on"><i data-lucide="map"></i><span class="tx">지도</span></a>
    <a href="#stats" id="nav-stats"><i data-lucide="chart-no-axes-column"></i><span class="tx">통계</span></a>
    <a href="/manage"><i data-lucide="pencil-line"></i><span class="tx">기록 관리</span></a>
    <button class="only-ic" id="open-settings" title="설정" aria-label="설정"><i data-lucide="settings-2"></i></button>
    <a href="javascript:void(0)" class="only-ic" onclick="tinyauthLogout()" data-ts-logout="1" title="로그아웃" aria-label="로그아웃"><i data-lucide="log-out"></i></a>
  </nav>
</header>

<div class="app" id="app">
  <aside class="side" id="sidebar">
    <div class="years" id="years"></div>
    <div class="side-head">
      <h2>방문 기록</h2>
      <span class="cnt"><b id="count-badge">0</b>번 방문</span>
      <button class="ib side-x" id="close-sidebar" aria-label="목록 닫기"><i data-lucide="x"></i></button>
    </div>
    <div class="vlist" id="list"></div>
  </aside>

  <main class="mapwrap" id="map-container">
    <div id="map"></div>
    <div class="fabs">
      <button class="fab only-narrow" id="list-toggle" title="목록" aria-label="목록"><i data-lucide="list"></i></button>
      <button class="fab" id="my-loc" title="내 위치" aria-label="내 위치"><i data-lucide="locate-fixed"></i></button>
      <button class="fab" id="heat-btn" title="히트맵" aria-label="히트맵"><i data-lucide="flame"></i></button>
    </div>

    <div class="np" id="now-playing" hidden>
      <div class="np-body">
        <div class="np-bar"><span class="np-live"><i></i>경로 재생 중</span><span class="np-prog" id="np-prog"></span></div>
        <div class="np-main">
          <div class="np-when"><b id="np-date"></b><span id="np-time"></span></div>
          <div class="np-what"><b id="np-venue"></b><span id="np-sub"></span></div>
        </div>
        <div class="np-foot"><span><small>분류</small><b id="np-cat"></b></span><span><small>이전 방문</small><b id="np-prev"></b></span><span><small>이 장소</small><b id="np-cnt"></b></span></div>
      </div>
      <div class="np-stub"><small>순번</small><b id="np-no"></b><div class="np-code" id="np-code"></div></div>
    </div>

    <div class="tl" id="time-capsule">
      <button class="tl-play play" id="play-btn" title="이동 경로 재생" aria-label="이동 경로 재생"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
      <button class="tl-play stop" id="stop-btn" title="정지" aria-label="정지" hidden><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
      <div class="tl-mid">
        <div class="tl-top"><span id="slider-label">불러오는 중</span><span class="tl-cnt" id="tl-cnt"></span></div>
        <div class="tl-track"><div id="scrubber"></div><div class="tl-years" id="tl-years"></div></div>
      </div>
      <div class="tl-side">
        <div class="seg" id="periods">
          <button data-days="7">1주</button><button data-days="30">1개월</button><button data-days="90">3개월</button><button data-days="365">1년</button><button data-days="all" class="on">전체</button>
        </div>
        <select class="sel" id="play-speed" title="재생 속도">
          <option value="800">느리게</option><option value="400" selected>보통</option><option value="150">빠르게</option><option value="50">아주 빠르게</option>
        </select>
      </div>
    </div>
  </main>

  <section class="stats" id="dash-modal" hidden>
    <div class="st-wrap" id="stats-root">
      <div class="st-head">
        <div><h1>통계</h1><p data-st="range"></p></div>
        <div class="seg" id="period-group">
          <button data-days="7">1주</button><button data-days="30">1개월</button><button class="on" data-days="90">3개월</button><button data-days="365">1년</button><button data-days="all">전체</button>
        </div>
      </div>
      <p class="st-sum" data-st="sum"></p>
      <div class="st-grid">
        <section class="st-sec wide" data-st="timeline"><h3>월별 방문</h3><div class="chart-box"><canvas id="chart-timeline"></canvas></div></section>
        <section class="st-sec" data-st="hourly"><h3>시간대</h3><div class="chart-box"><canvas id="chart-hourly"></canvas></div></section>
        <section class="st-sec" data-st="weekday"><h3>요일</h3><div class="chart-box"><canvas id="chart-weekday"></canvas></div></section>
        <section class="st-sec" data-st="venues"><h3>많이 간 장소</h3><div class="rk"></div></section>
        <section class="st-sec" data-st="cats"><h3>많이 간 분류</h3><div class="rk"></div></section>
        <section class="st-sec" data-st="regions"><h3>지역</h3><div class="rk"></div></section>
        <section class="st-sec" data-st="activity"><h3>요일 × 시간 <small>진할수록 자주</small></h3><div class="act-wrap"></div></section>
        <section class="st-sec wide" data-st="newv"><h3>처음 가 본 곳 <small>달마다 새로 생긴 장소 수</small></h3><div class="chart-box"><canvas id="chart-newvenues"></canvas></div></section>
      </div>
    </div>
  </section>
</div>

<script>
moment.locale('ko');
const $ = id => document.getElementById(id);
let map, markers, heatLayer = null, slider = null, isHeat = false, player = null;
let allMarkers = [], markerBy = new Map(), filtered = [], listLimit = 150, selT = null, statsPeriod = '90';

/* ── 지도 ── */
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 11);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  UI.baseMap(map);
  markers = L.markerClusterGroup({
    maxClusterRadius: 48, showCoverageOnHover: false, chunkedLoading: true, spiderfyOnMaxZoom: false, zoomToBoundsOnClick: false,
    iconCreateFunction: c => { const n = c.getChildCount(), s = n > 999 ? 46 : n > 99 ? 40 : 34;
      return L.divIcon({ className: '', html: `<div class="mk-cl" style="width:${s}px;height:${s}px">${n.toLocaleString()}</div>`, iconSize: [s, s] }); }
  });
  map.addLayer(markers);
  // 같은 자리 수백 번 방문을 거미줄로 펼치면 못 알아봐서, 더 확대할 수 없으면 목록 말풍선으로
  markers.on('clusterclick', e => {
    const b = e.layer.getBounds();
    if (map.getZoom() < map.getMaxZoom() && !b.getNorthEast().equals(b.getSouthWest())) return e.layer.zoomToBounds({ padding: [40, 40] });
    if (map.getZoom() < 17) return map.setView(e.layer.getLatLng(), 17);
    L.popup({ maxWidth: 300 }).setLatLng(e.layer.getLatLng()).setContent(SI.groupHTML(e.layer.getAllChildMarkers().map(m => m.item))).openOn(map);
  });
  let me = null;
  map.on('locationfound', e => { if (me) map.removeLayer(me); me = L.marker(e.latlng, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18] }) }).addTo(map); });
  map.on('locationerror', () => alert('현재 위치를 찾을 수 없어요.'));
}

function buildMarkers() {
  allMarkers = SI.all.map(d => {
    const m = L.marker([d.latNum, d.lngNum], { icon: L.divIcon({ className: '', html: '<div class="mk"></div>', iconSize: [14, 14] }) });
    m.item = d;
    m.bindPopup(() => SI.popupHTML(d), { maxWidth: 300 });
    m.on('popupopen', () => select(d.FSQ_UNIXTIME, true));
    markerBy.set(d.FSQ_UNIXTIME, m);
    return m;
  });
}

/* ── 기간 ── */
let MIN = 0, MAX = 0;
function initScrubber() {
  const all = SI.all; MIN = all[0].FSQ_UNIXTIME; MAX = all[all.length - 1].FSQ_UNIXTIME;
  $('gnb-range').textContent = `${moment.unix(MIN).format('YYYY.MM.DD')} — ${moment.unix(MAX).format('YYYY.MM.DD')}`;
  slider = noUiSlider.create($('scrubber'), { start: [MIN, MAX], connect: true, range: { min: MIN, max: MAX }, step: 86400, behaviour: 'tap-drag' });
  let t = null;
  slider.on('update', v => {
    const s = +v[0], e = +v[1];
    $('slider-label').innerHTML = `<b>${moment.unix(s).format('YYYY.MM.DD')}</b> 부터 <b>${moment.unix(e).format('YYYY.MM.DD')}</b> 까지`;
    clearTimeout(t); t = setTimeout(applyFilters, 60);
  });
  slider.on('slide', () => { setPeriodOn(null); setYearOn(null); });
  const years = [...new Set(all.map(d => moment.unix(d.FSQ_UNIXTIME).year()))];
  $('tl-years').innerHTML = years.map(y => { const ts = moment([y]).unix(); return ts < MIN ? '' : `<span style="left:${(ts - MIN) / (MAX - MIN) * 100}%">'${String(y).slice(2)}</span>`; }).join('');
  $('years').innerHTML = years.slice().reverse().map(y => `<button data-y="${y}" title="${y}년만 보기">${y}</button>`).join('');
  $('years').querySelectorAll('button').forEach(b => b.onclick = () => {
    const y = +b.dataset.y;
    if (b.classList.contains('on')) { setYearOn(null); setPeriodOn('all'); slider.set([MIN, MAX]); return; }
    setYearOn(y); setPeriodOn(null);
    slider.set([Math.max(MIN, moment([y]).unix()), Math.min(MAX, moment([y + 1]).unix() - 1)]);
  });
}
function setPeriodOn(days) { $('periods').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.days === days)); }
function setYearOn(y) { $('years').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.y === y)); }
$('periods').querySelectorAll('button').forEach(b => b.onclick = () => {
  setPeriodOn(b.dataset.days); setYearOn(null);
  slider.set([b.dataset.days === 'all' ? MIN : Math.max(MIN, MAX - parseInt(b.dataset.days) * 86400), MAX]);
});

/* ── 거르기·목록 ── */
function current() {
  const [s, e] = slider.get().map(Number), q = $('search-input').value.trim().toLowerCase();
  return SI.all.filter(d => d.FSQ_UNIXTIME >= s && d.FSQ_UNIXTIME <= e + 86399 && SI.match(d, q));
}
function applyFilters() {
  if (!slider || (player && player.playing)) return;
  filtered = current();
  if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
  markers.clearLayers();
  if (isHeat) {
    heatLayer = L.heatLayer(filtered.map(d => [d.latNum, d.lngNum, .5]), { radius: 22, blur: 16, maxZoom: 15,
      gradient: UI.theme() === 'board' ? { .3: '#5a4310', .6: '#B58A2C', 1: '#FFC23D' } : { .3: '#BFD0EE', .6: '#E8B23A', 1: '#E0574F' } }).addTo(map);
  } else {
    const ids = new Set(filtered.map(d => d.FSQ_UNIXTIME));
    markers.addLayers(allMarkers.filter(m => ids.has(m.item.FSQ_UNIXTIME)));
  }
  $('count-badge').textContent = filtered.length.toLocaleString();
  $('tl-cnt').textContent = `${filtered.length.toLocaleString()}번 방문`;
  listLimit = 150; renderList();
}
function renderList() {
  const items = filtered.slice(-listLimit).reverse();
  $('list').innerHTML = SI.listHTML(items, selT) + (filtered.length > listLimit ? `<button class="vmore" id="vmore">${(filtered.length - listLimit).toLocaleString()}번 더 보기</button>` : '');
  const more = $('vmore'); if (more) more.onclick = () => { listLimit += 300; renderList(); };
}
$('list').addEventListener('click', e => {
  const r = e.target.closest('.vrow'); if (!r) return;
  const t = +r.dataset.t, m = markerBy.get(t);
  select(t, false);
  if (window.innerWidth <= 900) toggleSide(false);
  if (!m || (player && player.playing)) return;
  map.setView(m.getLatLng(), Math.max(map.getZoom(), 17));
  L.popup({ maxWidth: 300, offset: [0, -4] }).setLatLng(m.getLatLng()).setContent(SI.popupHTML(m.item)).openOn(map);
});
function select(t, scroll) {
  selT = t;
  $('list').querySelectorAll('.vrow.sel').forEach(x => x.classList.remove('sel'));
  const r = $('list').querySelector(`.vrow[data-t="${t}"]`);
  if (r) { r.classList.add('sel'); if (scroll) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
let st = null; $('search-input').addEventListener('input', () => { clearTimeout(st); st = setTimeout(applyFilters, 150); });

/* ── 재생 ── */
function makePlayback() {
  return Playback.create(map, {
    padding: () => UI.theme() === 'board' ? [[60, 60], [60, 280]] : [[60, 110], [60, 130]],
    onStart(list) {
      $('play-btn').hidden = true; $('stop-btn').hidden = false; $('now-playing').hidden = false;
      markers.clearLayers(); if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
      filtered = list; listLimit = Math.max(150, list.length); renderList();
    },
    onStep(d, i, n) {
      SI.fillNP(d, i, n);
      $('slider-label').innerHTML = `<b>${i + 1}</b> / ${n} · <b>${moment.unix(d.FSQ_UNIXTIME).format('YYYY.MM.DD')}</b>`;
      select(d.FSQ_UNIXTIME, true);
    },
    onEnd() { $('slider-label').textContent = '재생을 마쳤어요'; setTimeout(stopPlay, 1800); },
  });
}
function startPlay() {
  const list = current(); if (!list.length) return;
  if (list.length > 3000 && !confirm(`${list.length.toLocaleString()}번 방문을 재생해요. 기간을 좁히면 더 보기 좋아요. 그대로 할까요?`)) return;
  player.start(list, +$('play-speed').value);
}
function stopPlay() {
  player.stop(true);
  $('play-btn').hidden = false; $('stop-btn').hidden = true; $('now-playing').hidden = true;
  slider.set(slider.get());
  applyFilters();
}
$('play-btn').onclick = startPlay;
$('stop-btn').onclick = stopPlay;
$('play-speed').onchange = e => player && player.setSpeed(+e.target.value);

/* ── 통계 ── */
function showStats(on) {
  if (on && player && player.playing) stopPlay();
  $('dash-modal').hidden = !on;
  $('nav-stats').classList.toggle('on', on); $('nav-map').classList.toggle('on', !on);
  if (on) SI.renderStats($('stats-root'), statsPeriod);
  else setTimeout(() => map.invalidateSize(), 50);
}
$('nav-stats').onclick = e => { e.preventDefault(); history.replaceState(null, '', '#stats'); showStats(true); };
$('nav-map').onclick = e => { e.preventDefault(); history.replaceState(null, '', location.pathname); showStats(false); };
$('period-group').querySelectorAll('button').forEach(b => b.onclick = () => {
  $('period-group').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  statsPeriod = b.dataset.days; SI.renderStats($('stats-root'), statsPeriod);
});

/* ── 그 밖 ── */
function toggleSide(force) { $('sidebar').classList.toggle('open', force); }
$('list-toggle').onclick = () => toggleSide();
$('close-sidebar').onclick = () => toggleSide(false);
$('my-loc').onclick = () => map.locate({ setView: true, maxZoom: 15 });
$('heat-btn').onclick = () => { isHeat = !isHeat; $('heat-btn').classList.toggle('on', isHeat); applyFilters(); };
$('open-settings').onclick = () => UI.openSettings();
window.addEventListener('ui:change', () => { if (!$('dash-modal').hidden) SI.renderStats($('stats-root'), statsPeriod); if (isHeat) applyFilters(); });
function clock() {
  const n = moment(), dg = s => [...s].map(c => `<i>${c}</i>`).join('');
  $('gnb-clock').innerHTML = `${dg(n.format('HH'))}<em>:</em>${dg(n.format('mm'))}<small>${n.format('M월 D일 dddd')}</small>`;
}
clock(); setInterval(clock, 15000);

window.addEventListener('load', async () => {
  UI.icons();
  initMap();
  player = makePlayback();
  try { await SI.load(); } catch (e) { $('list').innerHTML = '<div class="vempty">기록을 못 불러왔어요. 새로고침해 주세요.</div>'; return; }
  buildMarkers();
  initScrubber();
  applyFilters();
  if (location.hash === '#stats') showStats(true);
});
window.addEventListener('hashchange', () => showStats(location.hash === '#stats'));
</script>
<script>
function tinyauthLogout() {
  fetch('https://auth.b-612.kr/api/user/logout', { method: 'POST', credentials: 'include' })
    .finally(() => { window.location.href = 'https://auth.b-612.kr/login'; });
}
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
<script src="/static/ts.js" defer></script>
</body>
</html>
